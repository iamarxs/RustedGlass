name: Build RustedGlass release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit locked Windows dependencies
        shell: bash
        run: |
          archive=cargo-audit-x86_64-unknown-linux-gnu-v0.23.0
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' \
            "https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.23.0/$archive.tgz" -o "$archive.tgz"
          printf '%s  %s\n' 'b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59' "$archive.tgz" | sha256sum --check
          tar -xzf "$archive.tgz"
          "./$archive/cargo-audit" audit --file "$GITHUB_WORKSPACE/Cargo.lock" --target-arch x86_64 --target-os windows

  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test, build, and package
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'target'

          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }

          ./build.ps1

          $reported = (& ./build/RustedGlass.exe --version | Out-String).Trim()
          if ($reported -notmatch '^RustedGlass ([0-9]+\.[0-9]+\.[0-9]+)$') {
              throw "Unexpected version output: $reported"
          }
          $version = $Matches[1]

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match EXE version $version"
          }

          $exe = Get-Item ./build/RustedGlass.exe
          if ($exe.Length -gt 64MB) { throw "EXE exceeds 64 MiB: $($exe.Length) bytes" }

          New-Item -ItemType Directory -Path dist | Out-Null
          $zip = "dist/RustedGlass-$version-x86_64-pc-windows-msvc.zip"
          Compress-Archive -LiteralPath $exe.FullName -DestinationPath $zip
          $zipItem = Get-Item $zip
          if ($zipItem.Length -gt 64MB) { throw "ZIP exceeds 64 MiB: $($zipItem.Length) bytes" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustedglass-windows-x64
          path: dist/
          if-no-files-found: error
          overwrite: true

  sign:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, audit]
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rustedglass-windows-x64
          path: dist

      - name: Create update manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          filename="RustedGlass-$version-x86_64-pc-windows-msvc.zip"
          # Exactly one entry, at the ZIP root: RustedGlass.exe
          entries=$(unzip -Z1 "dist/$filename")
          if [ "$entries" != "RustedGlass.exe" ]; then
            echo "Unexpected ZIP contents: $entries"
            exit 1
          fi
          unzip -tq "dist/$filename"
          hash=$(sha256sum "dist/$filename" | cut -d ' ' -f 1)
          jq -n --arg version "$version" \
            --arg target "x86_64-pc-windows-msvc" \
            --arg filename "$filename" --arg sha256 "$hash" \
            '{version: $version, target: $target, filename: $filename, sha256: $sha256}' \
            > dist/update.json

      - name: Sign and verify update manifest
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_file"
          unset UPDATE_SIGNING_KEY

          openssl pkeyutl -sign -rawin -inkey "$key_file" \
            -in dist/update.json -out dist/update.json.sig

          openssl pkeyutl -verify -rawin -pubin -inkey assets/update-public.pem \
            -in dist/update.json -sigfile dist/update.json.sig

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/RustedGlass-$version-x86_64-pc-windows-msvc.zip" \
            dist/update.json dist/update.json.sig \
            --draft --verify-tag --generate-notes
