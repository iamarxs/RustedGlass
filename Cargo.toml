[package]
name = "rustedglass"
version = "1.0.0-alpha.1"
edition = "2021"
license = "MIT"
description = "RustedGlass image viewer, made with Rust."

[[bin]]
# The package is named in lower case, as Rust expects; the executable is a Windows app name.
name = "RustedGlass"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "bmp", "gif", "webp", "tiff", "qoi", "ico", "pnm", "tga", "dds", "hdr",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
