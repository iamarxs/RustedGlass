[package]
name = "rustedglass"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "RustedGlass image viewer, made with Rust."

[[bin]]
# The package is named in lower case, as Rust expects; the executable is a Windows app name.
name = "RustedGlass"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "bmp",
    "gif",
    "webp",
    "tiff",
    "qoi",
    "ico",
    "pnm",
    "tga",
    "dds",
    "hdr",
    "exr",
    "ff",
] }

ed25519-dalek = { version = "2.2", features = ["pem"] }
sha2 = "0.10"
zip = { version = "9.0.5", default-features = false, features = [
    "deflate-flate2",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Networking_WinHttp",
] }
